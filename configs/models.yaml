# Model configurations for policy regression benchmark evaluations.
# Providers: 'mock' or 'openai_compatible'.
# Security: api_key_env specifies the NAME of the environment variable containing the secret.

models:
  # Deterministic offline mock models (used by tests and offline dry runs)
  mock:
    name: mock
    provider: mock
    model_id: mock-deterministic-echo
    temperature: 0.0
    max_tokens: 4096
    timeout_s: 10.0
    mock_mode: echo

  mock_scripted:
    name: mock_scripted
    provider: mock
    model_id: mock-scripted-editor
    temperature: 0.0
    max_tokens: 4096
    timeout_s: 10.0
    mock_mode: scripted_edit

  mock_malformed:
    name: mock_malformed
    provider: mock
    model_id: mock-malformed-output
    temperature: 0.0
    max_tokens: 4096
    timeout_s: 10.0
    mock_mode: malformed

  # Active OpenAI-compatible profile
  openai_gpt4o_mini:
    name: openai_gpt4o_mini
    provider: openai_compatible
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    model_id: gpt-4o-mini
    temperature: 0.0
    max_tokens: 4096
    seed: 42
    timeout_s: 60.0

  # Example (a): Hosted OpenAI-compatible model (commented out template)
  # hosted_example:
  #   name: hosted_example
  #   provider: openai_compatible
  #   base_url: https://api.openai.com/v1
  #   api_key_env: OPENAI_API_KEY
  #   model_id: gpt-4o
  #   temperature: 0.0
  #   max_tokens: 4096
  #   seed: 42
  #   timeout_s: 60.0

  # Active local Ollama profile
  local_ollama:
    name: local_ollama
    provider: openai_compatible
    base_url: http://localhost:11434/v1
    model_id: llama3.1:8b
    temperature: 0.0
    max_tokens: 4096
    timeout_s: 300.0

